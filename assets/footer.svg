<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Let's turn data into decisions.">
<defs>
  <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5" stop-opacity="0"/><stop offset=".3" stop-color="#4F46E5"/><stop offset=".7" stop-color="#0D9488"/><stop offset="1" stop-color="#0D9488" stop-opacity="0"/></linearGradient>
  <radialGradient id="spark"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#4F46E5" stop-opacity=".6"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .s{animation:run 6s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes run{0%,100%{transform:translateX(140px)}50%{transform:translateX(1060px)}}
  .t{font:700 22px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#0F172A;text-anchor:middle;letter-spacing:-.3px}
  .m{font:500 13px 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;fill:#94A3B8;text-anchor:middle;letter-spacing:1.5px}
</style>
<rect x="0" y="16" width="1200" height="1.5" fill="url(#l)"/>
<ellipse class="s" cx="0" cy="16.7" rx="70" ry="8" fill="url(#spark)"/>
<text class="t" x="600.0" y="64">Let's turn data into decisions.</text>
<text class="m" x="600.0" y="92">OPEN TO DATA SCIENCE, ML &amp; DATA ANALYST OPPORTUNITIES · MUMBAI</text>
</svg>
