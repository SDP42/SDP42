<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Honours: 5× Hackathon winner; 2× Ideathon winner; JPMC Code for Good">
<title>Honours: 5× Hackathon winner; 2× Ideathon winner; JPMC Code for Good</title>
<defs><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cabinet"><rect width="1200" height="220" rx="20"/></clipPath></defs>
<style>@keyframes rise{from{opacity:0;transform:translateY(14px)}} @keyframes fade{from{opacity:0}} @keyframes grow{from{transform:scaleX(0)}} @keyframes pulse{50%{opacity:.25}} @keyframes blink{50%{opacity:0}} @keyframes shine{0%{transform:skewX(-20deg) translateX(0)}40%,100%{transform:skewX(-20deg) translateX(1700px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="219" rx="20" fill="#0b111b" stroke="#1c2636"/><g style="animation:rise 0.8s cubic-bezier(.22,.8,.2,1) 0.00s both"><rect x="20.0" y="20" width="377.3" height="180" rx="16" fill="#101827" stroke="#1c2636"/><text x="48.0" y="52" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="2.4" fill="#6b7689">HONOUR 01</text><text x="46.0" y="110" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="900" fill="#f3c75a">5×</text><text x="371.3" y="108" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#f4f6fa">Hackathon winner</text><text x="48.0" y="150" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aab5c8">Working AI, data and full-stack products built</text><text x="48.0" y="169" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aab5c8">against the clock.</text></g><g style="animation:rise 0.8s cubic-bezier(.22,.8,.2,1) 0.15s both"><rect x="411.3" y="20" width="377.3" height="180" rx="16" fill="#101827" stroke="#1c2636"/><text x="439.3333333333333" y="52" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="2.4" fill="#6b7689">HONOUR 02</text><text x="437.3" y="110" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="900" fill="#f3c75a">2×</text><text x="762.7" y="108" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#f4f6fa">Ideathon winner</text><text x="439.3" y="150" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aab5c8">Problem framing and solution design that won</text><text x="439.3" y="169" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aab5c8">the room.</text></g><g style="animation:rise 0.8s cubic-bezier(.22,.8,.2,1) 0.30s both"><rect x="802.7" y="20" width="377.3" height="180" rx="16" fill="#101827" stroke="#1c2636"/><text x="830.6666666666666" y="52" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="2.4" fill="#6b7689">HONOUR 03</text><text x="828.7" y="110" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="900" fill="#f3c75a">JPMC</text><text x="1154.0" y="108" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#f4f6fa">Code for Good</text><text x="830.7" y="150" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aab5c8">J.P. Morgan Chase &amp; Co. hackathon building</text><text x="830.7" y="169" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aab5c8">tech for non-profits.</text></g><g clip-path="url(#cabinet)"><rect x="-300" y="0" width="160" height="220" fill="url(#shine)" transform="skewX(-20)" style="animation:shine 6s ease-in-out 1s infinite"/></g>
