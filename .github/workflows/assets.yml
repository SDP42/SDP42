name: Profile assets

on:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/**", "tests/**", "README.md", ".github/workflows/assets.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assets match the generator
        run: python scripts/build.py --check

      - name: Tests
        run: python -m unittest discover -s tests -v
